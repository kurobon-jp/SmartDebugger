name: Verify UPM consumers

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        unity: ['2022.3.62f1', '6000.3.10f1']
        variant: [minimal, input-system, recording, disabled]
        include:
          - unity: '2022.1.24f1'
            variant: minimal
          - unity: '2022.1.24f1'
            variant: input-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Create isolated consumer
        run: python Tools/prepare_consumer.py --output .utmp/consumer --unity-version '${{ matrix.unity }}' --variant '${{ matrix.variant }}'
      - name: Run package and assembly checks
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .utmp/consumer
          unityVersion: ${{ matrix.unity }}
          testMode: EditMode
          artifactsPath: artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.unity }}-${{ matrix.variant }}
          path: artifacts
